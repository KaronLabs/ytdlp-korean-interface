name: Diagnose release source attestation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-release-source-attestation.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run same pre-release tests first
        shell: powershell
        env:
          RECOVERED_CATALOG: locales/ko-KR.json
        run: |
          python tests/run_contract_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/run_ci_powershell_tests.ps1
          exit $LASTEXITCODE
      - name: Compare tracked and isolated source paths after tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          . .\tools\build-candidate.ps1

          $source = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $tracked = @(Get-GitTrackedPaths -SourceRoot $source -GitPath $git.Source)
          $manifest = Get-DependencyArchiveManifest -SourceRoot $source
          $dependencyRoots = @($manifest.roots | ForEach-Object { [string]$_ })
          $status = (& $git.Source -C $source status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'git status failed' }

          Write-Host ('STATUS_AFTER_TESTS=' + $(if ([string]::IsNullOrWhiteSpace($status)) { '<clean>' } else { $status.Replace("`r`n", ' | ').Replace("`n", ' | ') }))
          Write-Host ('TRACKED_COUNT=' + $tracked.Count)
          Write-Host ('DEPENDENCY_ROOTS=' + ($dependencyRoots -join ','))

          $badOriginal = @()
          foreach ($relative in $tracked) {
            $rootName = ($relative -split '[/\\]')[0]
            $path = Join-Path $source $relative
            $valid = -not [string]::IsNullOrWhiteSpace($relative) -and -not [IO.Path]::IsPathRooted($relative) -and $relative -notmatch '(^|[\\/])\.\.([\\/]|$)' -and (Test-Path -LiteralPath $path -PathType Leaf)
            if (-not $valid) {
              $badOriginal += [pscustomobject]@{ path=$relative; root=$rootName; exists=(Test-Path -LiteralPath $path); leaf=(Test-Path -LiteralPath $path -PathType Leaf) }
            }
          }
          Write-Host ('BAD_ORIGINAL_COUNT=' + $badOriginal.Count)
          foreach ($item in $badOriginal) { Write-Host ('BAD_ORIGINAL ' + ($item | ConvertTo-Json -Compress)) }

          $workspace = Join-Path $env:RUNNER_TEMP 'source-attestation-diagnostic'
          if (Test-Path -LiteralPath $workspace) { Remove-Item -LiteralPath $workspace -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $isolated = New-IsolatedBuildSource -SourceRoot $source -WorkspaceRoot $workspace -DependencyRoots $dependencyRoots -TrackedPaths $tracked

          $missing = @()
          foreach ($relative in $tracked) {
            $rootName = ($relative -split '[/\\]')[0]
            $path = Join-Path $isolated $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $missing += [pscustomobject]@{ path=$relative; root=$rootName; expectedExcluded=($dependencyRoots -contains $rootName -or $rootName -eq '.git') }
            }
          }
          Write-Host ('MISSING_ISOLATED_COUNT=' + $missing.Count)
          foreach ($item in $missing) { Write-Host ('MISSING_ISOLATED ' + ($item | ConvertTo-Json -Compress)) }

          $sourceAttestation = Get-SourceAttestation -SourceRoot $source -GitPath $git.Source -TrackedPaths $tracked
          Write-Host ('SOURCE_ATTESTATION_OK trackedFileCount=' + $sourceAttestation.trackedFileCount + ' treeSha256=' + $sourceAttestation.treeSha256)
          $copyAttestation = Get-SourceInputAttestation -SourceRoot $isolated -Commit $sourceAttestation.commit -StatusPorcelain '' -TrackedPaths $tracked
          Write-Host ('COPY_ATTESTATION_OK trackedFileCount=' + $copyAttestation.trackedFileCount + ' treeSha256=' + $copyAttestation.treeSha256)
          if ($sourceAttestation.treeSha256 -cne $copyAttestation.treeSha256) { throw 'diagnostic_tree_digest_mismatch' }
      - name: Reproduce parent bootstrap and candidate build with stack trace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          . .\tools\release-factory.ps1
          . .\tools\release-orchestrator.ps1

          $root = Join-Path $env:RUNNER_TEMP 'candidate-build-diagnostic'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          try {
            Write-Host 'DIAG_PHASE=parent-bootstrap'
            $parent = New-VerifiedUpstreamParentRuntime -SourceRoot $env:GITHUB_WORKSPACE -WorkspaceRoot (Join-Path $root 'parent')
            Write-Host ('DIAG_PARENT_OK=' + $parent.ParentRuntime)
            Write-Host ('DIAG_YTDLP_TAG=' + $parent.YtDlpTag)
            Write-Host ('DIAG_YTDLP_SHA=' + $parent.YtDlpSha256)

            Write-Host 'DIAG_PHASE=candidate-build'
            $candidate = Invoke-ReleaseCandidateBuild -SourceRoot $env:GITHUB_WORKSPACE -ParentRuntime $parent.ParentRuntime -CandidateBase (Join-Path $root 'candidates')
            Write-Host ('DIAG_CANDIDATE_OK=' + $candidate.CandidateRoot)
            Write-Host ('DIAG_MANIFEST_SHA=' + $candidate.ManifestSha256)
          }
          catch {
            Write-Host ('DIAG_ERROR_TYPE=' + $_.Exception.GetType().FullName)
            Write-Host ('DIAG_ERROR_MESSAGE=' + $_.Exception.Message)
            Write-Host ('DIAG_POSITION=' + $_.InvocationInfo.PositionMessage)
            Write-Host ('DIAG_SCRIPT_STACK=' + $_.ScriptStackTrace)
            throw
          }

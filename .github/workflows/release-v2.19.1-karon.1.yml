name: First KaronLabs release

on:
  push:
    branches: [main]
    paths:
      - 'release/requests/v2.19.1-karon.1.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v2.19.1-karon.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run repository pre-release tests
        shell: powershell
        env:
          RECOVERED_CATALOG: locales/ko-KR.json
        run: |
          python tests/run_contract_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/run_ci_powershell_tests.ps1
          exit $LASTEXITCODE

      - name: Preflight fixed release request
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          . .\tools\release-factory.ps1
          $config = Get-FirstReleaseConfiguration
          $sourceSha = '${{ github.sha }}'.ToLowerInvariant()
          Read-ReleaseRequest -Path '.\release\requests\v2.19.1-karon.1.json' | Out-Null
          Assert-ReleaseSourceRevision -SourceRoot $env:GITHUB_WORKSPACE -ExpectedSha $sourceSha | Out-Null
          if ($null -eq (Get-Command gh.exe -CommandType Application -ErrorAction SilentlyContinue)) { throw 'GitHub CLI is required.' }

          function Assert-GitHubObjectMissing {
            param([Parameter(Mandatory = $true)] [string] $Endpoint, [Parameter(Mandatory = $true)] [string] $Label)
            $probeErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $output = @(& gh api $Endpoint 2>&1)
              $code = $LASTEXITCODE
            }
            finally { $ErrorActionPreference = $probeErrorActionPreference }
            if ($code -eq 0) { throw "$Label already exists; refusing to overwrite it." }
            $text = ($output | Out-String).Trim()
            if ($text -notmatch 'HTTP 404|Not Found') { throw "Could not prove $Label absence: $text" }
          }

          Assert-GitHubObjectMissing -Endpoint ("repos/$env:GITHUB_REPOSITORY/releases/tags/" + $config.Tag) -Label 'release'
          Assert-GitHubObjectMissing -Endpoint ("repos/$env:GITHUB_REPOSITORY/git/ref/tags/" + $config.Tag) -Label 'tag'

      - name: Build, smoke, and verify release payload
        id: payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          . .\tools\release-factory.ps1
          . .\tools\release-orchestrator.ps1
          . .\tools\release-archive.ps1

          $sourceSha = '${{ github.sha }}'.ToLowerInvariant()
          Assert-ReleaseSourceRevision -SourceRoot $env:GITHUB_WORKSPACE -ExpectedSha $sourceSha | Out-Null
          $config = Get-FirstReleaseConfiguration

          $workspace = Join-Path $env:RUNNER_TEMP 'karon-first-release'
          if (Test-Path -LiteralPath $workspace) { Remove-Item -LiteralPath $workspace -Recurse -Force }
          [IO.Directory]::CreateDirectory($workspace) | Out-Null

          $parentWorkspace = Join-Path $workspace 'parent-bootstrap'
          $parent = New-VerifiedUpstreamParentRuntime -SourceRoot $env:GITHUB_WORKSPACE -WorkspaceRoot $parentWorkspace

          $candidate = Invoke-ReleaseCandidateBuild `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -ParentRuntime $parent.ParentRuntime `
            -CandidateBase (Join-Path $workspace 'candidates')

          $smoke = Invoke-ReleaseArtifactSmoke `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -CandidateRoot $candidate.CandidateRoot `
            -ParentRuntime $parent.ParentRuntime `
            -CandidateManifestSha256 $candidate.ManifestSha256 `
            -DownloadsPath (Join-Path $workspace 'downloads')

          $dist = Join-Path $workspace 'dist'
          [IO.Directory]::CreateDirectory($dist) | Out-Null
          $package = New-ReleasePackage `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -CandidateRoot $candidate.CandidateRoot `
            -CandidateManifestSha256 $candidate.ManifestSha256 `
            -SourceSha $sourceSha `
            -SmokeEvidenceSha256 $smoke.EvidenceSha256 `
            -YtDlpTag $parent.YtDlpTag `
            -YtDlpSha256 $parent.YtDlpSha256 `
            -OutputRoot $dist

          Test-ReleasePackage -PackageRoot $package.PackageRoot | Out-Null
          $zipPath = New-ReleaseZip -PackageRoot $package.PackageRoot -OutputDirectory $dist
          Test-ReleaseZip -ZipPath $zipPath -PackageRoot $package.PackageRoot | Out-Null
          $checksumPath = Write-ReleaseChecksum -ZipPath $zipPath -OutputDirectory $dist
          $zipSha256 = Test-ReleaseChecksum -ZipPath $zipPath -ChecksumPath $checksumPath

          $manifest = Test-ReleasePackage -PackageRoot $package.PackageRoot
          if ([string]$manifest.sourceCommit -cne $sourceSha) { throw 'Final release manifest source SHA mismatch.' }
          if ([string]$manifest.ytDlp.tag -cne [string]$parent.YtDlpTag) { throw 'Final release manifest yt-dlp tag mismatch.' }
          if ([string]$manifest.ytDlp.sha256 -cne ([string]$parent.YtDlpSha256).ToLowerInvariant()) { throw 'Final release manifest yt-dlp SHA mismatch.' }

          $encoding = [Text.UTF8Encoding]::new($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "source_sha=$sourceSha`n", $encoding)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "zip_path=$zipPath`n", $encoding)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "checksum_path=$checksumPath`n", $encoding)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "package_root=$($package.PackageRoot)`n", $encoding)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "zip_sha256=$zipSha256`n", $encoding)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "candidate_manifest_sha256=$($candidate.ManifestSha256)`n", $encoding)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "smoke_evidence_sha256=$($smoke.EvidenceSha256)`n", $encoding)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "ytdlp_tag=$($parent.YtDlpTag)`n", $encoding)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "ytdlp_sha256=$($parent.YtDlpSha256)`n", $encoding)

      - name: Publish verified release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          . .\tools\release-factory.ps1
          . .\tools\release-archive.ps1

          $config = Get-FirstReleaseConfiguration
          $sourceSha = '${{ steps.payload.outputs.source_sha }}'.ToLowerInvariant()
          $zipPath = '${{ steps.payload.outputs.zip_path }}'
          $checksumPath = '${{ steps.payload.outputs.checksum_path }}'
          $packageRoot = '${{ steps.payload.outputs.package_root }}'

          Test-ReleasePackage -PackageRoot $packageRoot | Out-Null
          Test-ReleaseZip -ZipPath $zipPath -PackageRoot $packageRoot | Out-Null
          $localZipSha = Test-ReleaseChecksum -ZipPath $zipPath -ChecksumPath $checksumPath
          if ($localZipSha -cne '${{ steps.payload.outputs.zip_sha256 }}') { throw 'Payload/output ZIP SHA mismatch.' }

          function Assert-GitHubObjectMissing {
            param([Parameter(Mandatory = $true)] [string] $Endpoint, [Parameter(Mandatory = $true)] [string] $Label)
            $probeErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $output = @(& gh api $Endpoint 2>&1)
              $code = $LASTEXITCODE
            }
            finally { $ErrorActionPreference = $probeErrorActionPreference }
            if ($code -eq 0) { throw "$Label already exists; refusing to overwrite it." }
            $text = ($output | Out-String).Trim()
            if ($text -notmatch 'HTTP 404|Not Found') { throw "Could not prove $Label absence: $text" }
          }

          Assert-GitHubObjectMissing -Endpoint ("repos/$env:GITHUB_REPOSITORY/releases/tags/" + $config.Tag) -Label 'release'
          Assert-GitHubObjectMissing -Endpoint ("repos/$env:GITHUB_REPOSITORY/git/ref/tags/" + $config.Tag) -Label 'tag'

          $notesSource = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'release\notes\v2.19.1-karon.1.md'), [Text.UTF8Encoding]::new($false))
          $notesForPublish = Join-Path $env:RUNNER_TEMP 'v2.19.1-karon.1-release-notes.md'
          [IO.File]::WriteAllText($notesForPublish, ($notesSource.TrimEnd() + "`n`nSource commit: ``$sourceSha```n"), [Text.UTF8Encoding]::new($false))

          $draftCreated = $false
          try {
            & gh release create $config.Tag $zipPath $checksumPath --repo $env:GITHUB_REPOSITORY --target $sourceSha --title $config.Title --notes-file $notesForPublish --draft
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
            $draftCreated = $true

            $draft = (& gh release view $config.Tag --repo $env:GITHUB_REPOSITORY --json tagName,name,isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json)
            if (-not [bool]$draft.isDraft -or [bool]$draft.isPrerelease -or [string]$draft.tagName -cne $config.Tag -or [string]$draft.name -cne $config.Title -or [string]$draft.targetCommitish -cne $sourceSha) { throw 'Draft release metadata verification failed.' }
            $draftAssets = @($draft.assets)
            $draftNames = @($draftAssets | ForEach-Object { [string]$_.name } | Sort-Object)
            $expectedNames = @($config.ChecksumName, $config.ZipName) | Sort-Object
            if ($draftNames.Count -ne 2 -or $draftNames[0] -cne $expectedNames[0] -or $draftNames[1] -cne $expectedNames[1] -or @($draftAssets | Where-Object { [long]$_.size -le 0 }).Count -ne 0) { throw 'Draft release asset verification failed.' }

            & gh release edit $config.Tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
            $draftCreated = $false

            $published = (& gh release view $config.Tag --repo $env:GITHUB_REPOSITORY --json tagName,name,isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json)
            if ([bool]$published.isDraft -or [bool]$published.isPrerelease -or [string]$published.tagName -cne $config.Tag -or [string]$published.name -cne $config.Title -or [string]$published.targetCommitish -cne $sourceSha) { throw 'Published release metadata verification failed.' }
            $publishedAssets = @($published.assets)
            $publishedNames = @($publishedAssets | ForEach-Object { [string]$_.name } | Sort-Object)
            if ($publishedNames.Count -ne 2 -or $publishedNames[0] -cne $expectedNames[0] -or $publishedNames[1] -cne $expectedNames[1] -or @($publishedAssets | Where-Object { [long]$_.size -le 0 }).Count -ne 0) { throw 'Published release asset verification failed.' }

            $verifyDirectory = Join-Path $env:RUNNER_TEMP 'published-release-verify'
            if (Test-Path -LiteralPath $verifyDirectory) { Remove-Item -LiteralPath $verifyDirectory -Recurse -Force }
            [IO.Directory]::CreateDirectory($verifyDirectory) | Out-Null
            & gh release download $config.Tag --repo $env:GITHUB_REPOSITORY --pattern $config.ZipName --pattern $config.ChecksumName --dir $verifyDirectory
            if ($LASTEXITCODE -ne 0) { throw 'Published release download verification failed.' }

            $downloadedZip = Join-Path $verifyDirectory $config.ZipName
            $downloadedChecksum = Join-Path $verifyDirectory $config.ChecksumName
            $downloadedZipSha = Test-ReleaseChecksum -ZipPath $downloadedZip -ChecksumPath $downloadedChecksum
            if ($downloadedZipSha -cne $localZipSha) { throw 'Published ZIP bytes differ from the locally verified payload.' }
            Test-ReleaseZip -ZipPath $downloadedZip -PackageRoot $packageRoot | Out-Null
          }
          catch {
            if ($draftCreated) {
              $stateText = @(& gh release view $config.Tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,targetCommitish 2>$null)
              if ($LASTEXITCODE -eq 0) {
                try {
                  $state = ($stateText | Out-String) | ConvertFrom-Json
                  if ([bool]$state.isDraft -and [string]$state.tagName -ceq $config.Tag -and [string]$state.targetCommitish -ceq $sourceSha) {
                    & gh release delete $config.Tag --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes 2>$null | Out-Null
                  }
                } catch { }
              }
            }
            throw
          }

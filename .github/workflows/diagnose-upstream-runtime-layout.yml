name: Diagnose upstream runtime layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-upstream-runtime-layout.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - name: Inspect verified ErrorFlynn v2.19.1 x64 archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/ErrorFlynn/ytdlp-interface/releases/download/v2.19.1/ytdlp-interface.7z'
          $expected = '53b54e3c5c753e8cb2a8b9638c69c95c1449c8185c3145a9f0b06a2000b3702e'
          $root = Join-Path $env:RUNNER_TEMP 'upstream-layout'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $archive = Join-Path $root 'ytdlp-interface.7z'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "archive hash mismatch: $actual" }
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw 'trusted 7z missing' }
          $extract = Join-Path $root 'extract'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & $sevenZip x $archive ('-o' + $extract) -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z extraction failed' }

          Write-Host '=== REQUIRED FILE LOCATIONS ==='
          $required = @('ytdlp-interface.exe','yt-dlp.exe','ffmpeg.exe','ffprobe.exe','deno.exe','7z.dll','ytdlp-interface.json')
          foreach ($name in $required) {
            $matches = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter $name -Force)
            Write-Host ("$name COUNT=" + $matches.Count)
            foreach ($match in $matches) {
              Write-Host ('  ' + $match.FullName.Substring($extract.Length).TrimStart('\').Replace('\','/'))
            }
          }

          Write-Host '=== TOP-LEVEL ==='
          foreach ($item in @(Get-ChildItem -LiteralPath $extract -Force)) {
            Write-Host (($item.PSIsContainer ? 'DIR  ' : 'FILE ') + $item.Name)
          }

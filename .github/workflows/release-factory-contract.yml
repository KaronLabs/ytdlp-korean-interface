name: Release factory contract

on:
  push:
    branches: [main]
    paths:
      - 'tools/release-factory.ps1'
      - 'tools/release-orchestrator.ps1'
      - 'tools/release-archive.ps1'
      - 'tools/deploy-ssh-main.ps1'
      - 'release/notes/v2.19.1-karon.1.md'
      - '.github/workflows/release-v2.19.1-karon.1.yml'
      - 'tests/run_contract_tests.py'
      - 'tests/run_powershell_tests.ps1'
      - 'tests/run_ci_powershell_tests.ps1'
      - 'tests/powershell/deploy-ssh-main-security.Tests.ps1'
      - 'tests/powershell/release-factory.Tests.ps1'
      - 'tests/powershell/release-orchestrator.Tests.ps1'
      - 'tests/powershell/release-upstream-layout.Tests.ps1'
      - 'tests/powershell/release-publication-contract.Tests.ps1'
      - '.github/workflows/release-factory-contract.yml'
  pull_request:
    paths:
      - 'tools/release-factory.ps1'
      - 'tools/release-orchestrator.ps1'
      - 'tools/release-archive.ps1'
      - 'tools/deploy-ssh-main.ps1'
      - 'release/notes/v2.19.1-karon.1.md'
      - '.github/workflows/release-v2.19.1-karon.1.yml'
      - 'tests/run_contract_tests.py'
      - 'tests/run_powershell_tests.ps1'
      - 'tests/run_ci_powershell_tests.ps1'
      - 'tests/powershell/deploy-ssh-main-security.Tests.ps1'
      - 'tests/powershell/release-factory.Tests.ps1'
      - 'tests/powershell/release-orchestrator.Tests.ps1'
      - 'tests/powershell/release-upstream-layout.Tests.ps1'
      - 'tests/powershell/release-publication-contract.Tests.ps1'
      - '.github/workflows/release-factory-contract.yml'

permissions:
  contents: read

jobs:
  release-factory-contract:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run release factory contract tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/powershell/release-factory.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/powershell/release-orchestrator.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/powershell/release-upstream-layout.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/powershell/release-publication-contract.Tests.ps1
          exit $LASTEXITCODE
      - name: Run pre-release repository contracts
        shell: powershell
        env:
          RECOVERED_CATALOG: locales/ko-KR.json
        run: |
          python tests/run_contract_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/run_ci_powershell_tests.ps1
          exit $LASTEXITCODE

name: Karon.2 quality contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/karon2-quality-contract.yml'
      - 'ytdlp-interface/**'
      - 'locales/ko-KR.json'
      - 'tests/native/**'
      - 'tests/quality/**'
      - 'tests/powershell/**'
      - 'tools/test-quality-policy.ps1'
      - 'tools/quality-fixture.py'
      - 'tools/build-candidate.ps1'
      - 'tools/verify-gui-release-evidence.ps1'
      - 'tools/build-release-license-lock.ps1'
      - 'tools/package-quality-release.ps1'
      - 'release/dependencies/v2.19.1-karon.2.lock.json'
      - 'release/validation/v2.19.1-karon.2/**'
  pull_request:
    paths:
      - '.github/workflows/karon2-quality-contract.yml'
      - 'ytdlp-interface/**'
      - 'locales/ko-KR.json'
      - 'tests/native/**'
      - 'tests/quality/**'
      - 'tests/powershell/**'
      - 'tools/test-quality-policy.ps1'
      - 'tools/quality-fixture.py'
      - 'tools/build-candidate.ps1'
      - 'tools/verify-gui-release-evidence.ps1'
      - 'tools/build-release-license-lock.ps1'
      - 'tools/package-quality-release.ps1'
      - 'release/dependencies/v2.19.1-karon.2.lock.json'
      - 'release/validation/v2.19.1-karon.2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-contract:
    runs-on: windows-2022
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Native quality policy
        shell: powershell
        run: |
          $EvidenceRoot = Join-Path $env:RUNNER_TEMP ("quality-helper-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/test-quality-policy.ps1 -EvidenceRoot $EvidenceRoot -ImplementationReady
          exit $LASTEXITCODE
      - name: Quality fixture contracts
        shell: powershell
        run: |
          python -m unittest discover -s tests/quality -p 'test_*.py'
          exit $LASTEXITCODE
      - name: Prepare pinned FFmpeg test runtime
        shell: pwsh
        run: |
          $request = Get-Content -LiteralPath release/requests/v2.19.1-karon.2.json -Raw | ConvertFrom-Json
          $matches = @($request.runtimeOverlays | Where-Object { $_.id -ceq 'ffmpeg' })
          if ($matches.Count -ne 1) { throw 'CI FFmpeg overlay definition missing or ambiguous.' }
          $ffmpeg = $matches[0]
          $archive = Join-Path $env:RUNNER_TEMP $ffmpeg.archiveName
          Invoke-WebRequest -Uri $ffmpeg.assetUrl -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -cne ([string]$ffmpeg.archiveSha256).ToUpperInvariant()) {
            throw "CI FFmpeg archive SHA-256 mismatch: $actual"
          }
          $root = Join-Path $env:RUNNER_TEMP 'karon2-ffmpeg'
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $ffmpegExe = @(Get-ChildItem -LiteralPath $root -File -Filter ffmpeg.exe -Recurse)
          if ($ffmpegExe.Count -ne 1) { throw 'CI FFmpeg executable missing or ambiguous.' }
          $bin = $ffmpegExe[0].Directory.FullName
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'ffprobe.exe') -PathType Leaf)) {
            throw 'CI ffprobe executable missing.'
          }
          "KARON_TEST_FFMPEG_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: GUI and release PowerShell contracts
        shell: powershell
        run: |
          foreach ($test in @('gui-release-evidence-contract.Tests.ps1', 'release-license-lock.Tests.ps1', 'release-publication-contract.Tests.ps1')) {
            pwsh -NoProfile -File (Join-Path tests/powershell $test)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
